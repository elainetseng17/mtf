<style>
:root{--bg:#0f1115;--card:#171a21;--tx:#e8eaed;--mut:#8b93a1;--up:#16c784;--dn:#ea3943;--neu:#4b5563;--warn:#f0a020;--line:#252a33}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:12px;padding-top:calc(max(20px,env(safe-area-inset-top)) + 28px);padding-bottom:max(24px,env(safe-area-inset-bottom))}
html{background:var(--bg);-webkit-text-size-adjust:100%}
.foot button{background:var(--card);color:var(--tx);border:1px solid var(--mut);border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;margin:4px 3px}
.foot label{display:inline-flex;align-items:center;gap:4px;margin:4px 6px}
.conn{margin-top:6px;font-size:12px;color:var(--tx);line-height:1.6;text-align:left;white-space:pre-line}
button{font-family:inherit}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;color:var(--mut);border:0;border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--neu);color:var(--tx);font-weight:700}
.tfsel{display:flex;gap:6px;align-items:center;margin:10px 0 8px;font-size:12px;color:var(--mut)}
.tfsel button{background:var(--card);color:var(--tx);border:1px solid transparent;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer}
.tfsel button.on{border-color:var(--mut);font-weight:700}
@media (pointer:coarse){body{padding-top:calc(max(24px,env(safe-area-inset-top)) + 38px)}}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}
.top b{color:var(--tx);font-size:15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px}
.dot.stale{background:var(--warn)}
.symrow{display:flex;gap:6px;margin-bottom:8px}
.symrow input{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;text-transform:uppercase}
.symrow button,.scanbar button{background:var(--card);color:var(--tx);border:1px solid var(--mut);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer}
.price{font-size:32px;font-weight:700;margin:6px 0 0;font-variant-numeric:tabular-nums;transition:color .3s}
.price.up{color:var(--up)}.price.dn{color:var(--dn)}
.chg{font-size:12px;color:var(--mut);min-height:16px}
.badge{margin:6px 0 4px;padding:12px;border-radius:12px;text-align:center;font-size:28px;font-weight:800;letter-spacing:2px;background:var(--neu)}
.badge.long{background:var(--up)}.badge.short{background:var(--dn)}
.phase{text-align:center;font-size:13px;color:var(--tx);min-height:36px;line-height:1.4}
.tfs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0}
.tf{background:var(--card);border-radius:8px;padding:6px 2px;text-align:center}
.tf b{display:block;font-size:11px;color:var(--mut);font-weight:500}
.tf span{font-size:14px;font-weight:700}
.tf.long span{color:var(--up)}.tf.short span{color:var(--dn)}.tf.wait span{color:var(--mut)}
.box{background:var(--card);border-radius:10px;padding:8px 10px;margin:8px 0}
.box h4{margin:0 0 4px;font-size:12px;color:var(--mut);font-weight:500}
.r2{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;font-variant-numeric:tabular-nums}
.r2 .n{color:var(--mut);margin-left:8px;min-width:54px;text-align:right;display:inline-block}
.r2.entry .v{color:#4da3ff}.r2.sl .v{color:var(--dn)}.r2.tp .v{color:var(--up)}.r2.fib .v{color:var(--warn)}
canvas{width:100%;height:280px;display:block;background:var(--card);border-radius:10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
canvas.dragging{cursor:grabbing}
.hint{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut);margin-top:4px;min-height:26px}
.hint button{background:var(--card);color:var(--tx);border:1px solid var(--mut);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px}
.err{margin-top:6px;color:var(--warn);font-size:12px;word-break:break-all}
.foot{margin-top:10px;font-size:11px;color:var(--mut);text-align:center}
.alertbar{margin-top:8px;background:var(--warn);color:#201400;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;text-align:center}
.pins{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.pins.flash .pin{border-color:var(--warn)}
.pin{background:var(--card);border-radius:10px;padding:7px 9px;cursor:pointer;border:1px solid transparent}
.pin:hover{border-color:var(--mut)}
.pin .p1{display:flex;justify-content:space-between;align-items:baseline}
.pin .p1 b{font-size:14px}
.pin .p1 span{font-size:13px;font-variant-numeric:tabular-nums}
.pin .p2{font-size:11px;color:var(--mut);margin:2px 0 6px}
.lamps{display:flex;gap:4px}
.lamp{flex:1;text-align:center;font-size:11px;padding:2px 0;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
.lamp.on{font-weight:700;animation:glow 1.6s ease-in-out infinite}

<script>
/* ======================================================================
   核心:指標、多空判斷、0.5 右側進場計畫、交易所連線、掃描、釘選
   (由 mtf_signal.py 移植,完全在瀏覽器內執行;不下單、不需要任何 API 金鑰)
   ====================================================================== */
const TIMEFRAMES=['5m','15m','1h','4h','1d'];
const TF_SEC={'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400};
const WEIGHTS={'5m':0.05,'15m':0.10,'1h':0.20,'4h':0.30,'1d':0.35};
const SETUP_TFS=['5m','15m','1h','4h'];
const LONG_TH=25, SHORT_TH=-25;
const CFG={fib:0.5,tol_atr:0.1,confirm:2,max_retrace:0.786,zz_atr:2.0,min_leg_atr:5.0,lookback:200,major_frac:0.9,sub_frac:0.6,trend_filter:false,
           min_risk_atr:1.0,min_rr:1.2,sl_buf:0.2,chase:1.0};
const ZH={'多':'做多','空':'做空','觀望':'觀望'};
const CLS={'多':'long','空':'short','觀望':'wait'};
const TRD={'多':'偏多','空':'偏空','觀望':'中性'};
const SIDE={
  long:{action:'做多',leg:'上漲',pb:'回測',below:'下方',hold:'站穩',held:'已站回 0.5',confirmed:'已站穩 0.5',cross:'跌破'},
  short:{action:'做空',leg:'下跌',pb:'反彈',below:'上方',hold:'受壓',held:'已壓回 0.5 下方',confirmed:'已確認受壓於 0.5',cross:'突破'}
};
const PRICE_KEYS=['leg_start','leg_end','fib','pb_extreme','entry','sl','tp1','tp2'];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nowSec=()=>Date.now()/1000;

/* ---------- 指標 ---------- */
function ema(v,n){ const k=2/(n+1), out=[]; let e=v[0]; for(const x of v){ e=x*k+e*(1-k); out.push(e);} return out; }
function rsi(c,n=14){
  let g=0,l=0;
  for(let i=1;i<=n;i++){ const d=c[i]-c[i-1]; g+=Math.max(d,0); l+=Math.max(-d,0); }
  let ag=g/n, al=l/n;
  for(let i=n+1;i<c.length;i++){ const d=c[i]-c[i-1]; ag=(ag*(n-1)+Math.max(d,0))/n; al=(al*(n-1)+Math.max(-d,0))/n; }
  return al===0 ? 100 : 100-100/(1+ag/al);
}
function macdHist(c){
  const f=ema(c,12), s=ema(c,26), line=f.map((x,i)=>x-s[i]), sig=ema(line,9);
  return line.map((x,i)=>x-sig[i]);
}
function trueRanges(h,l,c){ const t=[]; for(let i=1;i<c.length;i++) t.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]))); return t; }
function atr(h,l,c,n=14){
  const trs=trueRanges(h,l,c); let a=0; for(let i=0;i<n;i++) a+=trs[i]; a/=n;
  for(let i=n;i<trs.length;i++) a=(a*(n-1)+trs[i])/n;
  return a;
}
function adx(h,l,c,n=14){
  const pdm=[],mdm=[],trs=trueRanges(h,l,c);
  for(let i=1;i<c.length;i++){
    const up=h[i]-h[i-1], dn=l[i-1]-l[i];
    pdm.push(up>dn&&up>0?up:0); mdm.push(dn>up&&dn>0?dn:0);
  }
  const wilder=x=>{ let s=0; for(let i=0;i<n;i++) s+=x[i]; const out=[s]; for(let i=n;i<x.length;i++){ s=s-s/n+x[i]; out.push(s);} return out; };
  const ptr=wilder(trs), pd=wilder(pdm), md=wilder(mdm), dx=[];
  for(let i=0;i<ptr.length;i++){
    const t=ptr[i]; if(t===0){ dx.push(0); continue; }
    const pi=100*pd[i]/t, mi=100*md[i]/t;
    dx.push(pi+mi===0?0:100*Math.abs(pi-mi)/(pi+mi));
  }
  let a=0; for(let i=0;i<n;i++) a+=dx[i]; a/=n;
  for(let i=n;i<dx.length;i++) a=(a*(n-1)+dx[i])/n;
  return a;
}
const maxOf=a=>{ let m=-Infinity; for(const x of a) if(x>m) m=x; return m; };
const minOf=a=>{ let m=Infinity; for(const x of a) if(x<m) m=x; return m; };

/* ---------- 單一級別趨勢評分 ---------- */
function scoreTimeframe(o,h,l,c){
  const price=c[c.length-1];
  const e20=ema(c,20).slice(-1)[0], e50=ema(c,50).slice(-1)[0];
  const e200=c.length>=200 ? ema(c,200).slice(-1)[0] : ema(c,100).slice(-1)[0];
  const hist=macdHist(c), r=rsi(c), a=adx(h,l,c), at=atr(h,l,c);
  let s=0; const notes=[];
  if(price>e20&&e20>e50&&e50>e200){ s+=40; notes.push('均線多頭排列'); }
  else if(price<e20&&e20<e50&&e50<e200){ s-=40; notes.push('均線空頭排列'); }
  else { s+=10*((price>e20?1:0)+(e20>e50?1:0)+(price>e200?1:0))-15; notes.push('均線糾結/轉換中'); }
  const h1=hist[hist.length-1], h2=hist[hist.length-2];
  if(h1>0) s+= h1>h2?25:10; else s-= h1<h2?25:10;
  if(r>=55&&r<70) s+=20;
  else if(r>=70){ s+=5; notes.push('RSI過熱,留意回檔'); }
  else if(r>30&&r<=45) s-=20;
  else if(r<=30){ s-=5; notes.push('RSI超賣,留意反彈'); }
  const n=h.length;
  if(price>=maxOf(h.slice(n-21,n-1))){ s+=15; notes.push('突破近20根高點'); }
  else if(price<=minOf(l.slice(n-21,n-1))){ s-=15; notes.push('跌破近20根低點'); }
  const regime=a>=22?'趨勢':'盤整';
  if(regime==='盤整'){ s=Math.trunc(s*0.6); notes.push('ADX低,盤整市,訊號降權'); }
  s=Math.max(-100,Math.min(100,s));
  return [s,{price,rsi:r,adx:a,atr:at,regime,notes}];
}
function labelOf(s){ return s>=LONG_TH?'多':s<=SHORT_TH?'空':'觀望'; }
function decide(results){
  if(!results['4h']||!results['1d']) throw new Error('缺少 4h 或 1d 資料,無法判斷大方向');
  const big=(results['4h'][0]+results['1d'][0])/2;
  return [null,big,big>=LONG_TH?'多':big<=SHORT_TH?'空':'觀望'];
}

/* ---------- 右側保守進場:前一波 → 回測 0.5 → 站穩 ---------- */
function zigzag(h,l,thr){
  const n=h.length, piv=[]; let trend=0, hi=0, lo=0, ext=0;
  for(let i=1;i<n;i++){
    if(trend===0){
      if(h[i]>h[hi]) hi=i;
      if(l[i]<l[lo]) lo=i;
      if(h[hi]-l[lo]>=thr){
        if(lo<hi){ piv.push([lo,'L',l[lo]]); trend=1; ext=hi; }
        else if(hi<lo){ piv.push([hi,'H',h[hi]]); trend=-1; ext=lo; }
      }
    } else if(trend===1){
      if(h[i]>h[ext]) ext=i;
      else if(h[ext]-l[i]>=thr){ piv.push([ext,'H',h[ext]]); trend=-1; ext=i; }
    } else {
      if(l[i]<l[ext]) ext=i;
      else if(h[i]-l[ext]>=thr){ piv.push([ext,'L',l[ext]]); trend=1; ext=i; }
    }
  }
  return [piv,trend,ext];
}
function evalLeg(h,l,c,atrV,cfg,piv,iL){
  const n=c.length, L=l[iL], segH=h.slice(iL), H=maxOf(segH), iH=iL+segH.indexOf(H);
  const out={state:'wait'}, rng=H-L, fib=H-cfg.fib*rng, deep=H-cfg.max_retrace*rng, tol=cfg.tol_atr*atrV;
  Object.assign(out,{leg_start:L,leg_end:H,leg_start_i:iL,leg_end_i:iH,fib});
  if(iH>=n-1) return out;
  const pbLow=minOf(l.slice(iH+1));
  out.pb_extreme=pbLow;
  if(pbLow<=L||pbLow<deep){ out.state='invalid'; return out; }
  let touch=null;
  for(let i=iH+1;i<n;i++) if(l[i]<=fib+tol){ touch=i; break; }
  if(touch===null) return out;
  let s=n;
  while(s-1>iH&&c[s-1]>fib) s--;
  s=Math.max(s,touch);
  const run=n-s; out.run=run;
  if(run<cfg.confirm){ out.state='testing'; return out; }
  const entry=c[s+cfg.confirm-1];
  const sl=Math.min(pbLow-cfg.sl_buf*atrV, entry-cfg.min_risk_atr*atrV);
  const tp1=H;
  const higher=piv.filter(p=>p[1]==='H'&&p[2]>tp1+0.1*atrV).map(p=>p[2]);
  let tp2,tp2Kind;
  if(higher.length){ tp2=minOf(higher); tp2Kind='prior'; } else { tp2=pbLow+rng; tp2Kind='measured'; }
  const risk=entry-sl;
  if(risk<=0){ out.state='invalid'; return out; }
  const rr=(tp1-entry)/risk;
  Object.assign(out,{entry,sl,tp1,tp2,tp2_kind:tp2Kind,rr});
  out.state=rr>=cfg.min_rr?'confirmed':'low_rr';
  return out;
}
function analyzeLong(h,l,c,atrV,cfg){
  const off=Math.max(0,c.length-(cfg.lookback||200));
  h=h.slice(off); l=l.slice(off); c=c.slice(off);
  const n=c.length, out={state:'no_leg'};
  if(n<30||atrV<=0) return out;
  const [piv,trend,ext]=zigzag(h,l,cfg.zz_atr*atrV);
  const pts=piv.slice();
  if(trend===1) pts.push([ext,'H',h[ext]]); else if(trend===-1) pts.push([ext,'L',l[ext]]);
  const minLeg=cfg.min_leg_atr*atrV, starts=[];
  for(let k=1;k<pts.length;k++)
    if(pts[k][1]==='H'&&pts[k-1][1]==='L'&&pts[k][2]-pts[k-1][2]>=minLeg&&!starts.includes(pts[k-1][0])) starts.push(pts[k-1][0]);
  if(!starts.length) return out;
  const cands=starts.map(iL=>evalLeg(h,l,c,atrV,cfg,piv,iL));
  const size=o=>o.leg_end-o.leg_start;
  const valid=cands.filter(o=>o.state!=='invalid');
  let best;
  if(valid.length){
    const top=Math.max(...valid.map(size));
    const major=valid.filter(o=>size(o)>=(cfg.major_frac||0.9)*top);
    best=major.reduce((a,b)=>b.leg_start_i>a.leg_start_i?b:a);
  } else best=cands.reduce((a,b)=>size(b)>size(a)?b:a);
  best.leg_start_i+=off; best.leg_end_i+=off;
  return best;
}
function analyzeShort(h,l,c,atrV,cfg){
  const out=analyzeLong(l.map(x=>-x),h.map(x=>-x),c.map(x=>-x),atrV,cfg);
  for(const k of PRICE_KEYS) if(out[k]!=null) out[k]=-out[k];
  return out;
}

/* ---------- 整理成要顯示的內容 ---------- */
const fp=x=>fmt(x);
function biasOf(results){ try{ return decide(results)[2]; }catch(e){ return null; } }
function sideView(results,setups,tf,price,cfg,side){
  const sw=SIDE[side], dirn=side==='long'?1:-1, opp=side==='long'?'空':'多';
  const su=setups[tf], s=su[side], atrV=su.atr, st=s.state, K=cfg.confirm;
  const view={action:'觀望',cls:'wait',phase:'',rows_title:'',rows:[],lines:[],leg:null,side};
  if(st==='no_leg') view.phase='尚未形成清楚的一波'+sw.leg+',先觀望';
  else if(st==='wait') view.phase='觀察中:主要一波'+sw.leg+' '+fp(s.leg_start)+'→'+fp(s.leg_end)+',等待'+sw.pb+'到 0.5('+fp(s.fib)+')';
  else if(st==='testing'){
    if(s.run===0) view.phase=sw.pb+' 0.5 中:收盤還在 '+fp(s.fib)+' '+sw.below+',等待確認'+sw.hold;
    else view.phase=sw.held+',再等 '+(K-s.run)+' 根收盤確認'+sw.hold;
  }
  else if(st==='invalid') view.phase=sw.pb+'過深或已'+sw.cross+'止損位,結構轉弱,放棄這一波';
  else if(st==='low_rr') view.phase=sw.confirmed+',但到止盈的盈虧比只有 '+s.rr.toFixed(1)+',不進場';
  else if(st==='confirmed'){
    const riskLive=dirn*(price-s.sl);
    if(riskLive<=0) view.phase='價格已碰到止損位,這個計畫失效';
    else if(dirn*(price-s.tp1)>=0) view.phase='已到止盈位,這一波結束,等新結構';
    else if(dirn*(price-s.entry)>cfg.chase*atrV||dirn*(s.tp1-price)/riskLive<cfg.min_rr)
      view.phase=sw.confirmed+',但現價離進場價太遠(盈虧比已變差),不追,等下一次'+sw.pb;
    else {
      view.action=sw.action; view.cls=side==='long'?'long':'short';
      view.phase=sw.confirmed+',可進場'+sw.action;
      if(results['1h']&&tf!=='1h'&&labelOf(results['1h'][0])===opp) view.phase+='(注意:1h 仍偏'+opp+')';
    }
  }
  const planned=st==='confirmed'||st==='low_rr';
  if(s.fib!=null){
    view.lines.push({p:s.fib,label:'0.5',kind:'fib'});
    if(!planned) view.lines.push({p:s.leg_end,label:'止盈',kind:'tp'},{p:s.leg_start,label:'止損',kind:'sl'});
    view.leg={si:s.leg_start_i,sp:s.leg_start,ei:s.leg_end_i,ep:s.leg_end};
  }
  if(planned){
    const e=s.entry, pct=v=>{ const x=(v-e)/e*100; return (x>=0?'+':'')+x.toFixed(2)+'%'; };
    const tp2Name=s.tp2_kind==='prior'?'止盈2':'止盈2(等幅延伸)';
    view.rows_title='進場計畫';
    view.rows=[
      {l:'建議進場',v:fp(e),n:'',c:'entry'},
      {l:'止損',v:fp(s.sl),n:pct(s.sl),c:'sl'},
      {l:'止盈1',v:fp(s.tp1),n:pct(s.tp1),c:'tp'},
      {l:tp2Name,v:fp(s.tp2),n:pct(s.tp2),c:'tp'},
      {l:'盈虧比(到止盈1)',v:s.rr.toFixed(2),n:'',c:''}];
    view.lines.push({p:e,label:'進場',kind:'entry'},{p:s.sl,label:'止損',kind:'sl'},
                    {p:s.tp1,label:'止盈1',kind:'tp'},{p:s.tp2,label:'止盈2',kind:'tp'});
  } else if(s.fib!=null){
    view.rows_title='關注價位';
    view.rows=[{l:sw.pb+'位 0.5',v:fp(s.fib),n:'',c:'fib'},{l:'止盈',v:fp(s.leg_end),n:'',c:'tp'},
               {l:'止損('+sw.cross+'即放棄)',v:fp(s.leg_start),n:'',c:'sl'}];
  }
  return view;
}
function rankOf(view,s){
  if(view.action==='做多'||view.action==='做空') return 4;
  return {testing:3,confirmed:2,wait:1}[s.state]||0;
}
function makeView(results,setups,tf,price,cfg){
  const bias=biasOf(results);
  const view={bias:bias?ZH[bias]:'--',
    tfs:TIMEFRAMES.filter(t=>results[t]).map(t=>({tf:t,dir:TRD[labelOf(results[t][0])],cls:CLS[labelOf(results[t][0])]})),
    action:'觀望',cls:'wait',phase:'',rows_title:'',rows:[],lines:[],leg:null,side:null,basis:''};
  let sides=['long','short'];
  if(cfg.trend_filter){
    if(bias==='觀望'){ view.phase='大級別(4h+1d)方向不明,先不操作'; view.basis='4h+1d 大趨勢不明 → 先不操作'; return view; }
    if(bias==='多'||bias==='空') sides=[bias==='多'?'long':'short'];
  }
  const cand={}; for(const sd of sides) cand[sd]=sideView(results,setups,tf,price,cfg,sd);
  const aligned={long:'多',short:'空'}, size={};
  for(const sd of sides){ const s=setups[tf][sd]; size[sd]=(s.state==='no_leg'||s.state==='invalid')?0:Math.abs(s.leg_end-s.leg_start); }
  const big=Math.max(...sides.map(sd=>size[sd]));
  const demoted=new Set(sides.filter(sd=>big>0&&size[sd]>0&&size[sd]<(cfg.sub_frac||0.6)*big));
  for(const sd of demoted) cand[sd]=Object.assign({},cand[sd],{action:'觀望',cls:'wait',rows:[],rows_title:'',lines:[],leg:null,phase:'這只是較小的波動,先以主要一波為準'});
  const key=sd=>[demoted.has(sd)?-1:rankOf(cand[sd],setups[tf][sd]),size[sd],aligned[sd]===bias?1:0,
                 setups[tf][sd].leg_end_i!=null?setups[tf][sd].leg_end_i:-1,sd==='long'?1:0];
  const cmp=(a,b)=>{ const ka=key(a), kb=key(b); for(let i=0;i<ka.length;i++){ if(ka[i]!==kb[i]) return ka[i]>kb[i]?1:-1; } return 0; };
  let best=sides.reduce((a,b)=>cmp(b,a)>0?b:a);
  let sv=cand[best];
  if(rankOf(sv,setups[tf][best])===0&&sides.length===2){
    const other=best==='long'?'short':'long';
    if(setups[tf][best].state==='no_leg'&&setups[tf][other].state!=='no_leg'){ best=other; sv=cand[other]; }
    else if(setups[tf].long.state==='no_leg'&&setups[tf].short.state==='no_leg')
      sv=Object.assign({},sv,{side:null,phase:'最近沒有清楚的主要波段,先觀望',lines:[],leg:null,rows:[],rows_title:''});
  }
  for(const k of ['action','cls','phase','rows_title','rows','lines','leg','side']) view[k]=sv[k];
  const sd=view.side;
  if(bias==='觀望') view.basis='4h+1d 大趨勢不明';
  else if(bias&&sd){
    const same=aligned[sd]===bias;
    view.basis=same?'4h+1d 大趨勢'+TRD[bias]+' · 與'+SIDE[sd].action+'同向(順勢)'
                   :'4h+1d 大趨勢'+TRD[bias]+' · '+SIDE[sd].action+'屬逆大趨勢(風險較高,請自行評估)';
  }
  return view;
}

/* ---------- K 線資料 ---------- */
function pack(rows){
  const d={t:[],o:[],h:[],l:[],c:[],forming:false};
  for(const [t,o,h,l,c] of rows){ d.t.push(t); d.o.push(+o); d.h.push(+h); d.l.push(+l); d.c.push(+c); }
  return d;
}
function markForming(d,tf,nowMs){
  nowMs=nowMs||Date.now();
  d.forming=d.t.length>0&&d.t[d.t.length-1]+TF_SEC[tf]*1000>nowMs; return d;
}
function ensureForming(d,tf,nowMs){
  nowMs=nowMs||Date.now(); const tfMs=TF_SEC[tf]*1000;
  if(!d.t.length) return d;
  if(d.t[d.t.length-1]+tfMs<=nowMs){
    const px=d.c[d.c.length-1];
    d.t.push(Math.floor(nowMs/tfMs)*tfMs); d.o.push(px); d.h.push(px); d.l.push(px); d.c.push(px);
  }
  d.forming=d.t[d.t.length-1]+tfMs>nowMs; return d;
}
function closedArrays(d){
  const n=d.c.length-(d.forming?1:0);
  return [d.o.slice(0,n),d.h.slice(0,n),d.l.slice(0,n),d.c.slice(0,n)];
}
function updateForming(d,tf,price,nowMs){
  if(!d.forming||!d.t.length) return;
  const tfMs=TF_SEC[tf]*1000, last=d.t[d.t.length-1], i=d.c.length-1;
  if(nowMs>=last+tfMs){
    const pc=d.c[i];
    d.t.push(last+Math.floor((nowMs-last)/tfMs)*tfMs); d.o.push(pc);
    d.h.push(Math.max(pc,price)); d.l.push(Math.min(pc,price)); d.c.push(price);
  } else {
    d.h[i]=Math.max(d.h[i],price); d.l[i]=Math.min(d.l[i],price); d.c[i]=price;
  }
}
const cloneK=d=>({t:d.t.slice(),o:d.o.slice(),h:d.h.slice(),l:d.l.slice(),c:d.c.slice(),forming:d.forming});
function computeAnalysis(data,cfg){
  const results={}, setups={};
  for(const tf of TIMEFRAMES){
    const d=data[tf]; if(!d) continue;
    const [o,h,l,c]=closedArrays(d);
    results[tf]=scoreTimeframe(o,h,l,c);
    if(SETUP_TFS.includes(tf)){
      const a=results[tf][1].atr;
      setups[tf]={long:analyzeLong(h,l,c,a,cfg),short:analyzeShort(h,l,c,a,cfg),atr:a};
    }
  }
  return [results,setups];
}
function lampsFor(results,setups,price,cfg){
  const out={};
  for(const tf of SETUP_TFS){
    if(!setups[tf]) continue;
    const v=makeView(results,setups,tf,price,cfg), on=v.action==='做多'||v.action==='做空';
    out[tf]={on,cls:on?v.cls:'',action:on?v.action:'',phase:v.phase};
  }
  return out;
}

/* ---------- 交易所連線(瀏覽器直接連,只用公開行情) ---------- */
class ExchangeError extends Error{}
class Limiter{
  constructor(rps){ this.gap=1000/rps; this.next=0; }
  async wait(){ const now=Date.now(), t=Math.max(now,this.next); this.next=t+this.gap; if(t>now) await sleep(t-now); }
}
const QS=new URLSearchParams(location.search);       /* ?bybit=…&bitunix=… 只給測試用 */
async function httpJson(url,lim,retries=3){
  let err=null;
  for(let i=0;i<=retries;i++){
    if(lim) await lim.wait();
    const ac=new AbortController(), to=setTimeout(()=>ac.abort(),15000);
    try{
      const r=await fetch(url,{signal:ac.signal,cache:'no-store'});
      if(r.ok){ const j=await r.json(); clearTimeout(to); return j; }   /* 逾時也涵蓋讀取內容,避免卡死 */
      clearTimeout(to);
      if([429,500,502,503,504].includes(r.status)&&i<retries){ await sleep(600*2**i); continue; }
      if(r.status===403) throw new ExchangeError('交易所拒絕連線(HTTP 403):可能是請求太頻繁被暫時限流,或所在地區受限');
      throw new ExchangeError('HTTP '+r.status);
    }catch(e){
      clearTimeout(to);
      if(e instanceof ExchangeError) throw e;
      err=e;
      if(i<retries){ await sleep(600*2**i); continue; }
    }
  }
  throw new ExchangeError('連線失敗(網路不通,或交易所不允許網頁直接連線):'+(err&&err.message||err));
}
const qstr=p=>p?'?'+new URLSearchParams(p).toString():'';

const EXCH={bybit:BYBIT,bitunix:BITUNIX};

/* K 線快取:該級別的新 K 線收盤(或超過 ttl)就重抓,否則直接用舊的,省流量也省請求 */
const KCACHE=new Map();
const KTTL={'5m':25,'15m':25,'1h':30,'4h':60,'1d':600};
async function getK(ex,sym,tf,ttl){
  const key=ex.key+'|'+sym+'|'+tf, hit=KCACHE.get(key), now=Date.now(), tfMs=TF_SEC[tf]*1000;
  if(ttl>0&&hit){
    const crossed=Math.floor((now-2000)/tfMs)>Math.floor((hit.t-2000)/tfMs);
    if(!crossed&&now-hit.t<ttl*1000) return hit.d;
  }
  const d=await ex.klines(sym,tf);
  if(ttl>0) KCACHE.set(key,{t:Date.now(),d});
  return d;
}
if(KCACHE.size>1500) KCACHE.clear();

/* ---------- 掃描 ---------- */
const MIN_BARS=60;
const Scan={gen:0,s:null};
function scanBlank(){ return {status:'idle',ex:null,tf:null,min_turn:0,done:0,total:0,scanned:0,skipped:0,failed:0,
  hits:[],near:[],started:null,finished:null,error:null,last_error:null}; }
Scan.s=scanBlank();
function scanStart(exk,tf,minTurn){
  if(!EXCH[exk]||!SETUP_TFS.includes(tf)) return;
  Scan.gen++; const gen=Scan.gen;
  Scan.s=scanBlank(); Object.assign(Scan.s,{status:'running',ex:exk,tf,min_turn:minTurn,started:nowSec()});
  scanRun(gen,exk,tf,minTurn);
}
function scanSnapshot(){
  const s=Object.assign({},Scan.s); s.hits=Scan.s.hits.slice(); s.near=Scan.s.near.slice();
  s.age=s.finished==null?null:nowSec()-s.finished;
  s.elapsed=s.started==null?null:(s.finished||nowSec())-s.started;
  return s;
}
function scanFail(gen,msg){ if(gen===Scan.gen){ Object.assign(Scan.s,{status:'error',error:msg,finished:nowSec()}); Scan.gen++; } }
function pivotLevels(h,l,k=3,look=150,keep=8){
  const n=h.length, hs=[], ls=[];
  for(let i=Math.max(k,n-look);i<n-k;i++){
    if(h[i]===Math.max(...h.slice(i-k,i+k+1))) hs.push(h[i]);
    if(l[i]===Math.min(...l.slice(i-k,i+k+1))) ls.push(l[i]);
  }
  return [hs.slice(-keep),ls.slice(-keep)];
}
async function scanOne(gen,ex,x,tf){
  if(gen!==Scan.gen) return ['skip',null];
  const sym=x.symbol; let results={};
  if(CFG.trend_filter){
    const d1=await getK(ex,sym,'1d',600), d4=await getK(ex,sym,'4h',600);
    const c1=closedArrays(d1), c4=closedArrays(d4);
    if(c1[3].length<MIN_BARS||c4[3].length<MIN_BARS) return ['skip',null];
    results={'1d':scoreTimeframe(...c1),'4h':scoreTimeframe(...c4)};
    if(decide(results)[2]==='觀望') return ['none',null];
  }
  const de=(tf==='4h'||tf==='1d')?await getK(ex,sym,tf,600):await ex.klines(sym,tf);
  const ce=closedArrays(de);
  if(ce[3].length<MIN_BARS) return ['skip',null];
  if(!results[tf]) results[tf]=scoreTimeframe(...ce);
  const atrV=results[tf][1].atr;
  const setups={[tf]:{long:analyzeLong(ce[1],ce[2],ce[3],atrV,CFG),short:analyzeShort(ce[1],ce[2],ce[3],atrV,CFG),atr:atrV}};
  const price=x.price, view=makeView(results,setups,tf,price,CFG), side=view.side;
  if(!side) return ['none',null];
  const s=setups[tf][side];
  const rec={symbol:sym,side,price,chg:x.chg,turnover:x.turnover,state:s.state,phase:view.phase,atr:atrV,ts:Math.round(results[tf][0]*(side==='long'?1:-1)*10)/10};
  if(view.action==='做多'||view.action==='做空'){
    try{
      const p2=(await ex.ticker(sym))[0];
      if(makeView(results,setups,tf,p2,CFG).action!==view.action) return ['none',null];
      rec.price=p2;
    }catch(e){}
    const wantDir=side==='long'?'多':'空';
    let allAligned=true;
    for(const t of ['5m','15m','1h']){
      if(!results[t]){
        const dt=await getK(ex,sym,t,KTTL[t]);
        const ct=closedArrays(dt);
        if(ct[3].length<MIN_BARS){ allAligned=false; break; }
        results[t]=scoreTimeframe(...ct);
      }
      if(labelOf(results[t][0])!==wantDir) allAligned=false;
    }
    const pv=pivotLevels(ce[1],ce[2]);
    Object.assign(rec,{action:view.action,entry:s.entry,sl:s.sl,tp1:s.tp1,tp2:s.tp2,rr:s.rr,pvh:pv[0],pvl:pv[1],allAligned});
    return ['hit',rec];
  }
  if(s.state==='testing'){ Object.assign(rec,{fib:s.fib,run:s.run}); return ['near',rec]; }
  return ['none',null];
}
async function scanRun(gen,exk,tf,minTurn){
  const ex=EXCH[exk]; let syms;
  try{ syms=(await ex.symbols()).filter(x=>x.turnover>=minTurn); }
  catch(e){ return scanFail(gen,'取得幣種清單失敗: '+e.message); }
  syms.sort((a,b)=>b.turnover-a.turnover);
  if(!syms.length) return scanFail(gen,'沒有符合成交額條件的幣種(可以調低最低成交額)');
  if(gen!==Scan.gen) return;
  Scan.s.total=syms.length;
  let idx=0;
  const worker=async()=>{
    while(gen===Scan.gen){
      const i=idx++; if(i>=syms.length) return;
      let kind,rec,err=null;
      try{ [kind,rec]=await scanOne(gen,ex,syms[i],tf); }catch(e){ kind='fail'; err=(e&&e.name||'Error')+': '+(e&&e.message||e); }
      if(gen!==Scan.gen) return;
      const s=Scan.s; s.done++;
      if(kind==='fail'){ s.failed++; s.last_error=err; }
      else if(kind==='skip') s.skipped++;
      else { s.scanned++; if(kind==='hit') s.hits.push(rec); else if(kind==='near') s.near.push(rec); }
      if(s.failed>=15&&s.scanned+s.skipped===0) return scanFail(gen,'連線一直失敗,已停止。最後錯誤:'+s.last_error);
    }
  };
  await Promise.all(Array.from({length:6},worker));
  if(gen===Scan.gen&&Scan.s.status==='running'){ Scan.s.status='done'; Scan.s.finished=nowSec(); }
}

function swingStruct(piv){
  const hs=piv.filter(p=>p[1]==='H').map(p=>p[2]).slice(-2), ls=piv.filter(p=>p[1]==='L').map(p=>p[2]).slice(-2);
  if(hs.length<2||ls.length<2) return '波段不足';
  if(hs[1]>hs[0]&&ls[1]>ls[0]) return '高低點墊高';
  if(hs[1]<hs[0]&&ls[1]<ls[0]) return '高低點下移';
  return '高低點混合(盤整)';
}
function techOne(d){
  const [o,h,l,c]=closedArrays(d), [sc,info]=scoreTimeframe(o,h,l,c), price=c[c.length-1];
  const e20=ema(c,20).slice(-1)[0], e50=ema(c,50).slice(-1)[0];
  const e200=c.length>=200?ema(c,200).slice(-1)[0]:ema(c,100).slice(-1)[0];
  const [piv]=zigzag(h,l,2*info.atr);
  const ups=piv.filter(p=>p[1]==='H'&&p[2]>price).map(p=>p[2]), dns=piv.filter(p=>p[1]==='L'&&p[2]<price).map(p=>p[2]);
  return {score:Math.round(sc),label:TRD[labelOf(sc)],price,e20,e50,e200,e200_is100:c.length<200,rsi:info.rsi,adx:info.adx,
          struct:swingStruct(piv),res:ups.length?minOf(ups):null,sup:dns.length?maxOf(dns):null};
}

  else if(s.status==='error') st='掃描失敗:'+s.error;

  } else {

  fillList($('hits'),hits,hitCard,none);

/* ---------- 圖表視窗(可拖曳/縮放) ---------- */
function clampView(n){
  VIEW.count=Math.max(Math.min(MINC,n),Math.min(VIEW.count,Math.min(n,MAXC)));
  VIEW.shift=Math.max(0,Math.min(VIEW.shift,n-VIEW.count));
}
function stepPx(n){
  const cv=$('chart');
  return (cv.clientWidth-PAD.l-PAD.r)/Math.max(1,Math.min(VIEW.count,n));
}
function setAnchor(cs){ VIEW.anchorT = VIEW.shift>0 ? cs[cs.length-1-VIEW.shift][0] : null; }
function resetView(){ VIEW.shift=0; VIEW.anchorT=null; VIEW.count=80; VIEW.yLo=VIEW.yHi=null; }
function updateLatest(){
  $('latest').style.display = VIEW.shift>0 ? 'inline-block' : 'none';
  $('yauto').style.display = VIEW.yLo!=null ? 'inline-block' : 'none';
}

function drawChart(s){
  const cv=$('chart'); if(!cv||!cv.getContext) return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||360, H=cv.clientHeight||280;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const cs=s.candles; if(!cs||!cs.length) return;
  const n=cs.length;
  if(VIEW.shift>0 && VIEW.anchorT!=null){          /* 往回捲時,新 K 線出現也要停在同一段 */
    const idx=cs.findIndex(k=>k[0]===VIEW.anchorT);
    if(idx>=0) VIEW.shift=n-1-idx;
  }
  clampView(n);
  const m=VIEW.count, right=n-1-VIEW.shift, left=right-m+1;
  const w=W-PAD.l-PAD.r, h=H-PAD.t-PAD.b, step=w/m;
  let lo=Infinity, hi=-Infinity;
  for(let i=left;i<=right;i++){ const k=cs[i]; if(k[3]<lo) lo=k[3]; if(k[2]>hi) hi=k[2]; }
  const span0=(hi-lo)||Math.abs(hi)*0.01||1;
  const lines=(s.lines||[]).filter(L=>L.p>lo-span0*0.35 && L.p<hi+span0*0.35);
  lines.forEach(L=>{ if(L.p<lo) lo=L.p; if(L.p>hi) hi=L.p; });
  const pad=((hi-lo)*0.04)||1; lo-=pad; hi+=pad;
  VIEW.lastLo=lo; VIEW.lastHi=hi;
  if(VIEW.yLo!=null){ lo=VIEW.yLo; hi=VIEW.yHi; }
  const Y=v=>PAD.t+(hi-v)/(hi-lo)*h;
  const X=i=>PAD.l+step*(i-left+0.5);
  g.font='10px sans-serif'; g.textBaseline='middle'; g.textAlign='left';
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4, y=Y(v);
    g.strokeStyle='rgba(255,255,255,0.06)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(PAD.l,y); g.lineTo(PAD.l+w,y); g.stroke();
    g.fillStyle='#8b93a1'; g.fillText(fmt(v), PAD.l+w+4, y);
  }
  g.save(); g.beginPath(); g.rect(PAD.l,PAD.t,w,h); g.clip();
  if(s.leg){                                        /* 前一波的走勢(虛線) */
    g.strokeStyle='rgba(154,164,178,0.55)'; g.lineWidth=1; g.setLineDash([2,3]);
    g.beginPath(); g.moveTo(X(s.leg[0]),Y(s.leg[1])); g.lineTo(X(s.leg[2]),Y(s.leg[3])); g.stroke();
    g.setLineDash([]);
  }
  const bw=Math.max(1,step*0.65);
  for(let i=left;i<=right;i++){
    const k=cs[i], col = k[4]>=k[1] ? '#16c784' : '#ea3943', x=X(i);
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,Y(k[2])); g.lineTo(x,Y(k[3])); g.stroke();
    const y1=Y(Math.max(k[1],k[4])), y2=Y(Math.min(k[1],k[4]));
    g.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
  }
  g.restore();
  const all=lines.filter(L=>L.p>=lo&&L.p<=hi).map(L=>({p:L.p,label:L.label,col:COL[L.kind]||'#9aa4b2',dash:true}));
  const px=(s.price!=null)?s.price:cs[n-1][4];
  if(px>=lo && px<=hi) all.push({p:px,label:'',col:COL.cur,dash:false});
  all.sort((a,b)=>Y(a.p)-Y(b.p));
  let prevY=-100;
  all.forEach(L=>{
    const y=Y(L.p); let ly=y; if(ly<prevY+13) ly=prevY+13; prevY=ly;
    g.strokeStyle=L.col; g.lineWidth=1; g.setLineDash(L.dash?[4,3]:[]);
    g.beginPath(); g.moveTo(PAD.l,y); g.lineTo(PAD.l+w,y); g.stroke(); g.setLineDash([]);
    g.fillStyle=L.col; g.fillRect(PAD.l+w+1,ly-7,PAD.r-2,14);
    g.fillStyle='#0f1115'; g.textAlign='left'; g.fillText(fmt(L.p),PAD.l+w+4,ly);
    if(L.label){
      const tw=g.measureText(L.label).width+6;
      g.fillStyle='rgba(15,17,21,0.85)'; g.fillRect(PAD.l+w-tw-2,ly-7,tw,14);
      g.fillStyle=L.col; g.textAlign='right'; g.fillText(L.label,PAD.l+w-5,ly); g.textAlign='left';
    }
  });
  const withDate=(cs[right][0]-cs[left][0])>20*3600*1000;
  g.fillStyle='#8b93a1'; g.textAlign='center';
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const i=left+Math.min(m-1,Math.round((m-1)*f));
    const x=Math.min(Math.max(X(i),PAD.l+(withDate?30:16)),PAD.l+w-(withDate?30:16));
    g.fillText(stamp(cs[i][0],withDate), x, H-8);
  });
  g.textAlign='left';
  if(hover && !drag && hover.x>=PAD.l && hover.x<=PAD.l+w){   /* 十字線 + 該根 OHLC */
    const i=left+Math.min(m-1,Math.max(0,Math.floor((hover.x-PAD.l)/step)));
    const k=cs[i], x=X(i);

/* ---------- 滑鼠/觸控:拖曳移動、滾輪縮放、右側價格軸上下縮放、雙擊重置 ---------- */
(function(){
  const cv=$('chart');
  const redraw=()=>{ if(lastState) drawChart(lastState); updateLatest(); };
  const onAxis=e=>(e.clientX-cv.getBoundingClientRect().left)>cv.clientWidth-PAD.r;
  const startManualY=()=>{ if(VIEW.yLo==null && VIEW.lastLo!=null){ VIEW.yLo=VIEW.lastLo; VIEW.yHi=VIEW.lastHi; } };
  const scaleY=(lo,hi,f)=>{
    const mid=(lo+hi)/2, half=Math.max((hi-lo)/2*f, Math.abs(mid)*1e-6+1e-12);
    VIEW.yLo=mid-half; VIEW.yHi=mid+half;
  };
  const ptrs=new Map(); let pinch=null;
  const dist=()=>{ const a=[...ptrs.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); };
  cv.addEventListener('pointerdown',e=>{
    if(!lastState||!lastState.candles) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){ drag=null; pinch={d:dist(),count:VIEW.count}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} return; }
    hover=null;
    if(onAxis(e)){ startManualY(); drag={mode:'y', y:e.clientY, lo:VIEW.yLo, hi:VIEW.yHi}; }
    else drag={mode:'x', x:e.clientX, y:e.clientY, shift:VIEW.shift, lo:VIEW.yLo, hi:VIEW.yHi};
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    cv.classList.add('dragging');
  });
  cv.addEventListener('pointermove',e=>{
    if(!lastState||!lastState.candles) return;
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const n=lastState.candles.length;
    if(pinch&&ptrs.size>=2){                         /* 兩指捏合:縮放 K 線數量 */
      VIEW.count=Math.round(pinch.count*pinch.d/Math.max(10,dist()));
      clampView(n); setAnchor(lastState.candles); redraw(); return;
    }
    if(drag && drag.mode==='y'){                     /* 拖曳價格軸:往下=拉寬(K線變扁)、往上=拉窄(K線變高) */
      if(drag.lo!=null) scaleY(drag.lo,drag.hi,Math.exp((e.clientY-drag.y)*0.006));
    } else if(drag){
      VIEW.shift=drag.shift+Math.round((e.clientX-drag.x)/stepPx(n));
      clampView(n); setAnchor(lastState.candles);
      if(drag.lo!=null){                             /* 價格軸已手動調整時,上下拖曳可平移價格 */
        const hpx=cv.clientHeight-PAD.t-PAD.b, dp=(e.clientY-drag.y)/hpx*(drag.hi-drag.lo);
        VIEW.yLo=drag.lo+dp; VIEW.yHi=drag.hi+dp;
      }
    } else {
      hover={x:e.clientX-cv.getBoundingClientRect().left};
      cv.style.cursor = onAxis(e) ? 'ns-resize' : '';
    }
    redraw();
  });
  const end=e=>{ if(e&&e.pointerId!=null) ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; drag=null; cv.classList.remove('dragging'); };
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',()=>{ if(!drag){ hover=null; redraw(); } });
  cv.addEventListener('dblclick',e=>{ if(onAxis(e)){ VIEW.yLo=VIEW.yHi=null; } else { resetView(); } redraw(); });
  cv.addEventListener('wheel',e=>{
    if(!lastState||!lastState.candles) return;
    e.preventDefault();
    const n=lastState.candles.length;
    if(onAxis(e)){                                   /* 在價格軸上滾動:縮放價格範圍 */
      startManualY();
      if(VIEW.yLo!=null) scaleY(VIEW.yLo,VIEW.yHi,e.deltaY<0?0.88:1/0.88);
    } else {
      const dx=e.deltaX||(e.shiftKey?e.deltaY:0);
      if(dx){ panAcc+=dx/stepPx(n); const whole=Math.trunc(panAcc); panAcc-=whole; VIEW.shift-=whole; }
      else { VIEW.count=Math.round(VIEW.count*(e.deltaY<0?0.85:1/0.85)); }
      clampView(n); setAnchor(lastState.candles);
    }
    redraw();
  },{passive:false});
  $('latest').onclick=()=>{ VIEW.shift=0; VIEW.anchorT=null; redraw(); };
  $('yauto').onclick=()=>{ VIEW.yLo=VIEW.yHi=null; redraw(); };
})();

function rankNorm(r){
  const atr=r.atr||0;
  const rr=Math.min(r.rr||0,4)/4;
  const tr=Math.min(Math.max(r.ts==null?0:r.ts,0),100)/100;
  let near=0.5, easy=0.5;

    near=1-Math.min(Math.abs(r.price-r.entry)/atr,1);
    easy=1-Math.min(Math.abs(r.tp1-r.entry)/atr/6,1);
  }
  return {rr:rr,tr:tr,near:near,easy:easy};
}
function rankParts(r){ const n=rankNorm(r); return {rr:n.rr*RW.rr,tr:n.tr*RW.tr,near:n.near*RW.near,easy:n.easy*RW.easy}; }

function tstr(t){ const d=new Date(t), p=n=>String(n).padStart(2,'0'); return (d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function dbl(el,fn){
  let last=0;

function simNewRound(){
  if(!confirm('結束這一輪(持倉會按現價平掉,全部記到「紀錄」),並用目前的本金設定開始新的一輪?')) return;
  SIM.pos.slice().forEach(p=>simClose(p,p.last!=null?p.last:p.entry,'reset'));
  const c=SIM.cfg, eq=SIM.cash;
  SIM.history.unshift({sid:SIM.sid,start:SIM.start,end:Date.now(),capital:c.capital,equity:eq,cfg:Object.assign({},c),trades:SIM.closed});
  if(SIM.history.length>200) SIM.history.length=200;
  SIM.sid++; SIM.start=Date.now(); SIM.closed=[]; SIM.cash=c.capital; SIM.done={}; SIM.running=false;
  simSave(); simRender(true);
}
function simSetCfg(k,v){
  const c=SIM.cfg;
  if(k==='levMax') c.levMax=!!v;
  else if(k==='marginMode'){
    c.marginMode=(v==='cross'?'cross':'isolated');
    SIM.pos.forEach(p=>{ p.marginMode=c.marginMode; });
    simUpdateAllLiq();
  }
  else if(k==='slMode'||k==='tpMode') c[k]=v;
  else{
    let n=Number(v);
    if(k==='minScore'||k==='minTs'){ if(!isFinite(n)){ simRender(true); return; } n=Math.max(-100,Math.min(100,n)); }
    else if(!isFinite(n)||n<=0){ simRender(true); return; }
    if(k==='lev') n=Math.min(125,Math.max(1,n));
    if(k==='maxPos') n=Math.min(20,Math.max(1,Math.round(n)));
    if(k==='capital'){ SIM.cash+=n-c.capital; simUpdateAllLiq(); }
    c[k]=n;
  }
  simSave(); simRender(true);
}

function simExport(ss){

  const rows=[['輪次','幣種','方向','槓桿','保證金','開倉價','平倉價','止損','止盈','結果','損益USDT','開倉時間','平倉時間','交易所','級別','評分','盈虧比','趨勢分','進場距離ATR','最大順行%','最大逆行%','持倉分鐘']];
  const iso=t=>new Date(t).toISOString();
  ss.slice().reverse().forEach(s=>s.trades.slice().reverse().forEach(x=>rows.push([s.sid,x.sym,x.side==='long'?'多':'空',x.lev,x.margin,x.entry,x.exit,x.sl,x.tp,RS[x.reason]||x.reason,x.pnl.toFixed(4),iso(x.openT),iso(x.closeT),x.ex||'',x.tf||'',x.score==null?'':x.score,x.rr==null?'':Number(x.rr).toFixed(2),x.f&&x.f.ts!=null?x.f.ts:'',x.f&&x.f.near!=null?x.f.near.toFixed(2):'',x.mfe==null?'':x.mfe.toFixed(3),x.mae==null?'':x.mae.toFixed(3),Math.round((x.closeT-x.openT)/60000)])));
  const txt=String.fromCharCode(65279)+rows.map(r=>r.map(q).join(',')).join(String.fromCharCode(10));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download='sim_trades_'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

const simMean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function bucketStats(list,fn,defs){
  return defs.map(d=>{
    const g=list.filter(t=>{ const v=fn(t); return v!=null&&v>=d[1]&&v<d[2]; });
    return {label:d[0],n:g.length,win:g.length?g.filter(t=>t.pnl>0).length/g.length*100:0,avg:simMean(g.map(t=>t.pnl)),tot:g.reduce((a,t)=>a+t.pnl,0)};
  });
}
function settled(list){ return list.slice(); }
function verdict(t){
  const out=[], held=(t.closeT-t.openT)/60000;
  const f=t.f||{}, rk=t.rk, rw=t.rw;
  if(t.reason==='tp'){
    out.push('✅ 止盈');
    if(rk&&t.mae!=null&&t.mae>0.7*rk) out.push('中途差點被止損(最大逆行 '+t.mae.toFixed(2)+'%,止損距離 '+rk.toFixed(2)+'%),進場點還能更好');
  }else if(t.reason==='sl'){
    out.push('❌ 止損');
    if(rw&&t.mfe!=null&&t.mfe>=0.6*rw) out.push('曾走到止盈距離的 '+Math.round(t.mfe/rw*100)+'% 才反轉:可考慮分批止盈,或賺一半後把止損移到成本');
    else if(held<10) out.push('進場後 '+Math.max(1,Math.round(held))+' 分鐘就被止損:可能追太晚或遇到假突破');
    else out.push('方向判斷錯誤,或被正常波動掃到(最大順行只有 '+(t.mfe==null?'?':t.mfe.toFixed(2))+'%)');
    if(f.ts!=null&&f.ts<=0) out.push('進場時趨勢分是逆勢('+f.ts+')');
  }else if(t.reason==='liq'){
    out.push('💥 強平:槓桿太高,強平價比止損更近');
  }else out.push('手動 / 結束本輪平倉,不計入統計');
  return out.join(';');
}
function simSuggest(list){
  const fl=settled(list).filter(t=>t.f&&t.f.n);
  const w=fl.filter(t=>t.pnl>0), l=fl.filter(t=>t.pnl<=0);
  const R={n:fl.length,ok:fl.length>=30&&w.length>=8&&l.length>=8};
  if(!R.ok) return R;
  const keys=['rr','tr','near','easy'];
  const d=keys.map((k,i)=>simMean(w.map(t=>t.f.n[i]))-simMean(l.map(t=>t.f.n[i])));
  const raw=d.map(x=>Math.max(x,0)+0.03), sum=raw.reduce((a,b)=>a+b,0);
  const nw=keys.map((k,i)=>Math.round(0.5*RW[k]+0.5*raw[i]/sum*100));
  const diff=100-nw.reduce((a,b)=>a+b,0); nw[nw.indexOf(Math.max(...nw))]+=diff;
  R.d=d; R.weights={rr:nw[0],tr:nw[1],near:nw[2],easy:nw[3]};
  const all=simMean(fl.map(t=>t.pnl)); R.all=all;
  const best=(vals,fn)=>{ let b=null;
    vals.forEach(v=>{ const g=fl.filter(t=>fn(t)>=v); if(g.length>=Math.max(15,fl.length*0.4)){ const a=simMean(g.map(t=>t.pnl)); if(a>all&&(!b||a>b.avg)) b={t:v,n:g.length,avg:a}; } });
    return b; };
  R.ts=best([0,25,50,75],t=>t.f.ts==null?-100:t.f.ts);
  R.sc=best([50,55,60,65,70],t=>t.score==null?0:t.score);
  return R;
}

  return d;

/* ---------- 模擬單的 K 線 ---------- */
function simKLines(){
  const X=simKX; if(!X) return [];
  const p=X.pid!=null?SIM.pos.find(q=>q.id===X.pid):null;
  if(p) return [['開倉',p.entry,'#4da3ff'],['止損',p.sl,'#ff5a5f'],['止盈',p.tp,'#2ecc71'],['強平',p.liq,'#f5a623'],['現價',p.last,'#cccccc']];
  const t=X.trade;
  if(t) return [['開倉',t.entry,'#4da3ff'],['平倉',t.exit,'#cccccc'],['止損',t.sl,'#ff5a5f'],['止盈',t.tp,'#2ecc71'],['強平',t.liq,'#f5a623']];
  return [];
}
function simRenderKEdit(){
  const box=$('simkedit'); if(!box) return;
  box.textContent='';
  const X=simKX; if(!X||X.pid==null) return;
  const p=SIM.pos.find(q=>q.id===X.pid); if(!p) return;
  if(isLiqBeforeSl(p)){
    const w=mk('div','','⚠️ 警示：目前強平價 ('+fmt(p.liq)+') 比止損價 ('+fmt(p.sl)+') 更靠近現價，行情反轉會先被強制平倉！');
    w.style.cssText='background:rgba(245,166,35,0.16);border:1px solid #f5a623;color:#f5a623;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;margin-bottom:8px';
    box.appendChild(w);
  }
  const row=mk('div','simrow'); row.style.flexWrap='wrap';
  const sSpan=mk('span','','止損'); sSpan.style.width='auto';
  const sInp=document.createElement('input'); sInp.type='number'; sInp.step='any'; sInp.value=p.sl; sInp.style.cssText='width:105px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 6px';
  const tSpan=mk('span','','止盈'); tSpan.style.width='auto';
  const tInp=document.createElement('input'); tInp.type='number'; tInp.step='any'; tInp.value=p.tp; tInp.style.cssText='width:105px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 6px';
  const btn=mk('button','','儲存修改'); btn.style.cssText='background:#1d3b2c;color:var(--tx);border:1px solid var(--up);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700';
  const msg=mk('div','',''); msg.style.cssText='width:100%;font-size:11px;color:var(--warn);margin-top:4px';
  btn.onclick=()=>{
    const nSl=Number(sInp.value), nTp=Number(tInp.value);
    const cur=p.last!=null?p.last:p.entry;
    if(!isFinite(nSl)||!isFinite(nTp)||nSl<=0||nTp<=0){ msg.textContent='請輸入有效的正數價格'; return; }
    if(p.side==='long'){
      if(nSl>=cur){ msg.textContent='做多止損必須低於現價 ('+fmt(cur)+')'; return; }
      if(nTp<=cur){ msg.textContent='做多止盈必須高於現價 ('+fmt(cur)+')'; return; }
    } else {
      if(nSl<=cur){ msg.textContent='做空止損必須高於現價 ('+fmt(cur)+')'; return; }
      if(nTp>=cur){ msg.textContent='做空止盈必須低於現價 ('+fmt(cur)+')'; return; }
    }
    p.sl=nSl; p.tp=nTp;
    simSave(); simDrawK(); simRender(true); simRenderKEdit();
    msg.style.color='var(--up)'; msg.textContent='✅ 已更新止盈止損設定';
  };
  row.appendChild(sSpan); row.appendChild(sInp);
  row.appendChild(tSpan); row.appendChild(tInp);
  row.appendChild(btn); row.appendChild(msg);
  box.appendChild(row);
}
function simShowK(x){

  const p=x.pid!=null?SIM.pos.find(q=>q.id===x.pid):null;

async function simKLoad(){
  const X=simKX; if(!X) return;
  const tfs=$('simktf'); tfs.textContent='';
  ['5m','15m','1h','4h'].forEach(t=>{ const b=mk('button',t===X.tf?'on':'',t); b.onclick=()=>{ X.tf=t; simKLoad(); }; tfs.appendChild(b); });
  X.err='載入中…'; simDrawK();
  try{ const d=await simKlines(X.ex,X.sym,X.tf); if(simKX!==X) return; X.d=d; X.err=''; X.at=Date.now(); }
  catch(e){ if(simKX!==X) return; X.err='K 線載入失敗'; }
  simDrawK();
}
function simKRefresh(){
  const X=simKX; if(!X||$('simk').style.display==='none') return;
  if(X.pid!=null&&Date.now()-X.at>30000&&X.err==='') simKLoad(); else simDrawK();
}
function simDrawK(){
  const X=simKX, cv=$('simkc'); if(!X||!cv.getContext) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||360, H=cv.clientHeight||320;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const up=cs.getPropertyValue('--up').trim()||'#2ecc71', dn=cs.getPropertyValue('--dn').trim()||'#ff5a5f', mut=cs.getPropertyValue('--mut').trim()||'#888';
  const leg=$('simkleg'); leg.textContent='';
  const lines=simKLines().filter(x=>x[1]!=null&&isFinite(x[1]));
  lines.forEach(x=>{ const s=mk('span','',x[0]+' '+fmt(x[1])); s.style.color=x[2]; s.style.marginRight='10px'; leg.appendChild(s); });
  const d=X.d;
  if(!d||!d.c||!d.c.length){ g.fillStyle=mut; g.font='13px sans-serif'; g.fillText(X.err||'沒有資料',12,24); return; }
  const n=d.c.length, cnt=Math.min(100,n), s0=n-cnt, padL=4, padR=62, padT=8, padB=6;
  let lo=Infinity, hi=-Infinity;
  for(let i=s0;i<n;i++){ lo=Math.min(lo,d.l[i]); hi=Math.max(hi,d.h[i]); }
  const rg=hi-lo||1, vis=lines.filter(x=>x[1]>lo-rg&&x[1]<hi+rg);
  vis.forEach(x=>{ lo=Math.min(lo,x[1]); hi=Math.max(hi,x[1]); });
  const R=(hi-lo)||1, Y=v=>padT+(hi-v)/R*(H-padT-padB), st=(W-padL-padR)/cnt;
  for(let i=s0;i<n;i++){
    const x=padL+(i-s0)*st+st/2, col=d.c[i]>=d.o[i]?up:dn;
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,Y(d.h[i])); g.lineTo(x,Y(d.l[i])); g.stroke();
    const y1=Y(Math.max(d.o[i],d.c[i])), y2=Y(Math.min(d.o[i],d.c[i]));
    g.fillRect(x-st*0.35,y1,st*0.7,Math.max(1,y2-y1));
  }
  const barAt=t=>{ if(!d.t||t==null) return -1; let k=-1; for(let i=s0;i<n;i++){ if(d.t[i]!=null&&d.t[i]<=t) k=i; } return k; };
  const mark=(t,col)=>{ const k=barAt(t); if(k<0) return; const x=padL+(k-s0)*st+st/2; g.strokeStyle=col; g.setLineDash([2,3]); g.beginPath(); g.moveTo(x,padT); g.lineTo(x,H-padB); g.stroke(); g.setLineDash([]); };
  const p=X.pid!=null?SIM.pos.find(q=>q.id===X.pid):null, tr=p||X.trade;
  if(tr){ mark(tr.openT,'#4da3ff'); if(!p) mark(tr.closeT,'#cccccc'); }
  vis.forEach(x=>{
    g.strokeStyle=x[2]; g.fillStyle=x[2]; g.lineWidth=1; g.setLineDash(x[0]==='強平'?[2,3]:[6,3]);
    g.beginPath(); g.moveTo(padL,Y(x[1])); g.lineTo(W-padR,Y(x[1])); g.stroke(); g.setLineDash([]);
    g.font='11px sans-serif'; g.fillText(x[0]+' '+fmt(x[1]),W-padR+3,Y(x[1])+4);
  });
}
function simKClose(){ simKX=null; $('simk').style.display='none'; }
function simOpenModal(){ $('simmodal').style.display='flex'; $('simmodal').scrollTop=0; simRender(true); simTick(); }
async function simInit(){

/* ---------- 手機用:提醒音/震動、螢幕保持亮著、連線檢查 ---------- */
let AC=null;
function unlockAudio(){ try{ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); } if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} }
document.addEventListener('pointerdown',unlockAudio,{passive:true});
function buzz(){
  if(!$('snd').checked) return;
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]); }catch(e){}
  try{
    if(!AC) return;
    [0,0.22,0.44].forEach((t,i)=>{
      const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=i===2?1175:880; o.type='sine';
      g.gain.setValueAtTime(0.0001,AC.currentTime+t); g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t+0.18);
      o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+0.2);
    });
  }catch(e){}
}
let wl=null;
async function applyAwake(){
  try{
    if($('awake').checked && !document.hidden && 'wakeLock' in navigator){ if(!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{ wl=null; }); } }
    else if(wl){ await wl.release(); wl=null; }
  }catch(e){ wl=null; }
}
$('awake').checked=LS.get('mtf_awake','1')==='1'; $('snd').checked=LS.get('mtf_snd','1')==='1';
$('awake').onchange=()=>{ LS.set('mtf_awake',$('awake').checked?'1':'0'); applyAwake(); };
$('snd').onchange=()=>{ LS.set('mtf_snd',$('snd').checked?'1':'0'); if($('snd').checked){ unlockAudio(); buzz(); } };
document.addEventListener('visibilitychange',applyAwake);

applyAwake();
